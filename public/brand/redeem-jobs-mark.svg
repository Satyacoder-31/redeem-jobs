<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mark-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF333A" />
      <stop offset="100%" stop-color="#E11D23" />
    </linearGradient>
    <linearGradient id="mark-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#F57C00" />
