<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="rtp-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF2329" />
      <stop offset="100%" stop-color="#D9141B" />
    </linearGradient>
    <linearGradient id="rtp-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F1C" />
      <stop offset="100%" stop-color="#F37905" />
    </linearGradient>
    <filter id="rtp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#EF2329" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- RTP Emblem -->
  <g transform="translate(10, 0)">
    <!-- Letter R (Left, Vibrant Red) -->
    <path d="M 125 15 
             C 95 15, 70 28, 65 52 
             C 61 72, 78 86, 108 86 
             L 128 86 
             L 92 122 
             L 60 122 
             L 85 97 
             C 60 95, 45 78, 48 50 
             C 53 18, 88 0, 132 0 
             L 155 0 
             L 142 15 
             Z" 
          fill="url(#rtp-red)" />
    
    <!-- Letter R Inner Hole -->
    <path d="M 100 32 
             C 88 32, 82 39, 84 50 
             C 86 60, 95 68, 114 68 
             L 130 68 
             L 130 32 
             Z" 
          fill="url(#rtp-red)" opacity="0.95" />

    <!-- Letter T (Center, Vibrant Golden-Orange) -->
    <!-- T Top Horizontal Bar -->
    <path d="M 148 0 
             L 252 0 
             L 242 18 
             L 158 18 
             Z" 
          fill="url(#rtp-gold)" />
    <!-- T Vertical Stem -->
    <path d="M 188 18 
             L 212 18 
             L 207 132 
             L 193 132 
             Z" 
          fill="url(#rtp-gold)" />

    <!-- Letter P (Right, Vibrant Red) -->
    <path d="M 245 0 
             L 290 0 
             C 334 0, 368 18, 372 50 
             C 376 80, 345 97, 305 97 
             L 258 97 
             L 258 122 
             L 240 122 
             L 240 15 
             L 268 15 
             C 305 15, 350 24, 350 52 
             C 350 74, 320 82, 285 82 
             L 258 82 
             L 258 15 
             L 245 0 
             Z" 
          fill="url(#rtp-red)" />
  </g>

  <!-- Typography -->
  <!-- Primary: REDEEM JOBS -->
  <text x="210" y="146" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="4" 
        fill="url(#rtp-red)">
    REDEEM JOBS
  </text>

  <!-- Subtitle: Training & Placement Solutions -->
  <text x="210" y="170" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif" 
        font-size="14.5" 
        font-weight="600" 
        letter-spacing="1.8" 
        fill="url(#rtp-gold)">
    Training &amp; Placement Solutions
  </text>
</svg>
